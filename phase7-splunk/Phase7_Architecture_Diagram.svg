<svg viewBox="0 0 900 620" width="900" height="620" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">

  <!-- Background -->
  <rect width="900" height="620" fill="#0d1117" rx="12"/>

  <!-- Title -->
  <text x="450" y="38" text-anchor="middle" fill="#58a6ff" font-size="18" font-weight="bold">Home SOC Lab — Phase 7: Splunk Integration</text>
  <text x="450" y="58" text-anchor="middle" fill="#8b949e" font-size="11">Lance Vidaure | github.com/lanceanthony/Home-SOC-Lab</text>

  <!-- ── ZONE LABELS ── -->
  <!-- Lab Network Zone -->
  <rect x="30" y="75" width="840" height="430" fill="none" stroke="#30363d" stroke-width="1.5" rx="8" stroke-dasharray="6,3"/>
  <text x="48" y="95" fill="#30363d" font-size="11" font-weight="bold">INTERNAL LAB NETWORK — 192.168.10.0/24 (VirtualBox Internal Network: SOC-Lab-Network)</text>

  <!-- Host-Only Zone label -->
  <rect x="580" y="430" width="280" height="60" fill="none" stroke="#388bfd" stroke-width="1" rx="6" stroke-dasharray="4,3"/>
  <text x="720" y="448" text-anchor="middle" fill="#388bfd" font-size="10">Host-Only Network — 192.168.56.0/24</text>

  <!-- ── BOXES ── -->

  <!-- pfSense -->
  <rect x="55" y="110" width="160" height="110" fill="#161b22" stroke="#f0883e" stroke-width="2" rx="8"/>
  <text x="135" y="135" text-anchor="middle" fill="#f0883e" font-size="13" font-weight="bold">pfSense</text>
  <text x="135" y="152" text-anchor="middle" fill="#8b949e" font-size="10">Firewall / Router</text>
  <text x="135" y="168" text-anchor="middle" fill="#c9d1d9" font-size="10">LAN: 192.168.10.1</text>
  <text x="135" y="183" text-anchor="middle" fill="#c9d1d9" font-size="10">WAN: 10.0.2.15 (NAT)</text>
  <text x="135" y="200" text-anchor="middle" fill="#8b949e" font-size="9">Syslog → UDP 514</text>

  <!-- WinServer-DC -->
  <rect x="55" y="270" width="160" height="130" fill="#161b22" stroke="#3fb950" stroke-width="2" rx="8"/>
  <text x="135" y="295" text-anchor="middle" fill="#3fb950" font-size="13" font-weight="bold">WinServer-DC</text>
  <text x="135" y="312" text-anchor="middle" fill="#8b949e" font-size="10">Windows Server 2022</text>
  <text x="135" y="328" text-anchor="middle" fill="#c9d1d9" font-size="10">IP: 192.168.10.10</text>
  <text x="135" y="344" text-anchor="middle" fill="#c9d1d9" font-size="9">Active Directory / DNS</text>
  <text x="135" y="360" text-anchor="middle" fill="#3fb950" font-size="9">Splunk UF 10.4.0</text>
  <text x="135" y="376" text-anchor="middle" fill="#3fb950" font-size="9">Sysmon v15.20</text>

  <!-- Kali Linux -->
  <rect x="55" y="450" width="160" height="90" fill="#161b22" stroke="#f85149" stroke-width="2" rx="8"/>
  <text x="135" y="475" text-anchor="middle" fill="#f85149" font-size="13" font-weight="bold">Kali Linux</text>
  <text x="135" y="492" text-anchor="middle" fill="#8b949e" font-size="10">Attacker VM</text>
  <text x="135" y="508" text-anchor="middle" fill="#c9d1d9" font-size="10">IP: 192.168.10.30</text>
  <text x="135" y="524" text-anchor="middle" fill="#8b949e" font-size="9">nmap / Hydra / Metasploit</text>

  <!-- Ubuntu / Splunk (center) -->
  <rect x="330" y="160" width="240" height="210" fill="#161b22" stroke="#58a6ff" stroke-width="2.5" rx="8"/>
  <text x="450" y="188" text-anchor="middle" fill="#58a6ff" font-size="14" font-weight="bold">Ubuntu 22.04</text>
  <text x="450" y="206" text-anchor="middle" fill="#58a6ff" font-size="11">Splunk Enterprise 9.3.2</text>
  <line x1="340" y1="215" x2="560" y2="215" stroke="#30363d" stroke-width="1"/>
  <text x="450" y="232" text-anchor="middle" fill="#c9d1d9" font-size="10">IP: 192.168.10.20 (Lab)</text>
  <text x="450" y="248" text-anchor="middle" fill="#c9d1d9" font-size="10">IP: 192.168.56.102 (Host-Only)</text>
  <text x="450" y="268" text-anchor="middle" fill="#8b949e" font-size="10" font-weight="bold">Indexes</text>
  <text x="450" y="284" text-anchor="middle" fill="#c9d1d9" font-size="10">windows_logs</text>
  <text x="450" y="299" text-anchor="middle" fill="#c9d1d9" font-size="10">network_logs</text>
  <text x="450" y="319" text-anchor="middle" fill="#8b949e" font-size="10" font-weight="bold">Listeners</text>
  <text x="450" y="335" text-anchor="middle" fill="#c9d1d9" font-size="10">TCP 9997 — UF Receiver</text>
  <text x="450" y="350" text-anchor="middle" fill="#c9d1d9" font-size="10">UDP 514 — Syslog</text>
  <text x="450" y="365" text-anchor="middle" fill="#c9d1d9" font-size="10">TCP 8000 — Web UI</text>

  <!-- Windows Host -->
  <rect x="640" y="160" width="200" height="110" fill="#161b22" stroke="#d2a8ff" stroke-width="2" rx="8"/>
  <text x="740" y="185" text-anchor="middle" fill="#d2a8ff" font-size="13" font-weight="bold">Windows Host</text>
  <text x="740" y="202" text-anchor="middle" fill="#8b949e" font-size="10">Physical Machine</text>
  <text x="740" y="218" text-anchor="middle" fill="#c9d1d9" font-size="10">Running VirtualBox</text>
  <text x="740" y="238" text-anchor="middle" fill="#d2a8ff" font-size="10">Browser → Splunk UI</text>
  <text x="740" y="254" text-anchor="middle" fill="#c9d1d9" font-size="10">http://192.168.56.102:8000</text>

  <!-- ── ARROWS ── -->

  <!-- WinServer-DC → Ubuntu: UF TCP 9997 -->
  <line x1="215" y1="320" x2="330" y2="280" stroke="#3fb950" stroke-width="1.8" marker-end="url(#arrowGreen)"/>
  <rect x="218" y="285" width="100" height="28" fill="#0d1117" rx="4"/>
  <text x="268" y="298" text-anchor="middle" fill="#3fb950" font-size="9" font-weight="bold">TCP 9997</text>
  <text x="268" y="310" text-anchor="middle" fill="#8b949e" font-size="9">UF → Splunk</text>

  <!-- pfSense → Ubuntu: Syslog UDP 514 -->
  <line x1="215" y1="175" x2="330" y2="220" stroke="#f0883e" stroke-width="1.8" marker-end="url(#arrowOrange)"/>
  <rect x="218" y="180" width="100" height="28" fill="#0d1117" rx="4"/>
  <text x="268" y="193" text-anchor="middle" fill="#f0883e" font-size="9" font-weight="bold">UDP 514</text>
  <text x="268" y="205" text-anchor="middle" fill="#8b949e" font-size="9">Syslog → Splunk</text>

  <!-- Windows Host → Ubuntu: Web UI TCP 8000 -->
  <line x1="640" y1="215" x2="570" y2="250" stroke="#d2a8ff" stroke-width="1.8" marker-end="url(#arrowPurple)"/>
  <rect x="578" y="200" width="90" height="28" fill="#0d1117" rx="4"/>
  <text x="623" y="213" text-anchor="middle" fill="#d2a8ff" font-size="9" font-weight="bold">TCP 8000</text>
  <text x="623" y="225" text-anchor="middle" fill="#8b949e" font-size="9">Browser → UI</text>

  <!-- Kali → WinServer/Ubuntu: attack arrows -->
  <line x1="215" y1="490" x2="330" y2="340" stroke="#f85149" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowRed)"/>
  <text x="255" y="420" text-anchor="middle" fill="#f85149" font-size="9">Attack Traffic</text>

  <!-- Data flow labels inside Splunk box -->

  <!-- WinServer sourcetypes legend -->
  <rect x="330" y="400" width="240" height="80" fill="#161b22" stroke="#30363d" stroke-width="1" rx="6"/>
  <text x="450" y="420" text-anchor="middle" fill="#8b949e" font-size="10" font-weight="bold">Sourcetypes in windows_logs</text>
  <text x="355" y="437" fill="#3fb950" font-size="9">● WinEventLog:Security (4624/4625/4672...)</text>
  <text x="355" y="452" fill="#3fb950" font-size="9">● WinEventLog:System</text>
  <text x="355" y="467" fill="#3fb950" font-size="9">● WinEventLog:Application</text>
  <text x="355" y="482" fill="#3fb950" font-size="9">● WinEventLog:Sysmon (EID 1/8/16/22...)</text>

  <!-- pfSense sourcetype -->
  <rect x="55" y="565" width="160" height="30" fill="#161b22" stroke="#30363d" stroke-width="1" rx="4"/>
  <text x="135" y="584" text-anchor="middle" fill="#f0883e" font-size="9">network_logs → sourcetype: syslog</text>

  <!-- Arrow markers -->
  <defs>
    <marker id="arrowGreen" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#3fb950"/>
    </marker>
    <marker id="arrowOrange" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#f0883e"/>
    </marker>
    <marker id="arrowPurple" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#d2a8ff"/>
    </marker>
    <marker id="arrowRed" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#f85149"/>
    </marker>
  </defs>

  <!-- Legend -->
  <rect x="640" y="310" width="200" height="155" fill="#161b22" stroke="#30363d" stroke-width="1" rx="6"/>
  <text x="740" y="330" text-anchor="middle" fill="#8b949e" font-size="11" font-weight="bold">Legend</text>
  <line x1="655" y1="345" x2="685" y2="345" stroke="#3fb950" stroke-width="2"/>
  <text x="695" y="349" fill="#c9d1d9" font-size="10">UF Log Forwarding</text>
  <line x1="655" y1="365" x2="685" y2="365" stroke="#f0883e" stroke-width="2"/>
  <text x="695" y="369" fill="#c9d1d9" font-size="10">Syslog (UDP)</text>
  <line x1="655" y1="385" x2="685" y2="385" stroke="#d2a8ff" stroke-width="2"/>
  <text x="695" y="389" fill="#c9d1d9" font-size="10">Web UI Access</text>
  <line x1="655" y1="405" x2="685" y2="405" stroke="#f85149" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="695" y="409" fill="#c9d1d9" font-size="10">Attack Traffic</text>
  <line x1="655" y1="425" x2="685" y2="425" stroke="#58a6ff" stroke-width="2"/>
  <text x="695" y="429" fill="#c9d1d9" font-size="10">Splunk (SIEM)</text>
  <text x="740" y="455" text-anchor="middle" fill="#8b949e" font-size="9">VirtualBox 7.x | Host: 8GB RAM</text>

</svg>
