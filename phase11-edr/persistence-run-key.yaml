# T1547.001 - Boot or Logon Autostart Execution: Registry Run Keys
# Tactic: Persistence
# Author: Lance Vidaure
# Tuned to process+command-line telemetry (sensor does not emit REGISTRY_WRITE by default)
detect:
  event: NEW_PROCESS
  op: and
  rules:
    - op: is windows
    - op: ends with
      path: event/FILE_PATH
      value: reg.exe
      case sensitive: false
    - op: contains
      path: event/COMMAND_LINE
      value: CurrentVersion\Run
      case sensitive: false
respond:
  - action: report
    name: Registry Run Key Persistence (T1547.001)
    metadata:
      tactic: Persistence
      technique: T1547.001
      author: Lance Vidaure
