# T1070 - Indicator Removal
# Tactic: Defense Evasion
# Author: Lance Vidaure
# Fires on execution of fsutil.exe or wevtutil.exe (log/journal clearing)
detect:
  event: NEW_PROCESS
  op: and
  rules:
    - op: is windows
    - op: or
      rules:
        - op: ends with
          path: event/FILE_PATH
          value: wevtutil.exe
          case sensitive: false
        - op: ends with
          path: event/FILE_PATH
          value: fsutil.exe
          case sensitive: false
respond:
  - action: report
    name: Log/Indicator Clearing (T1070)
    metadata:
      tactic: Defense Evasion
      technique: T1070
      author: Lance Vidaure
