# T1003.001 - OS Credential Dumping: LSASS Memory
# Tactic: Credential Access
# Author: Lance Vidaure
# Fires when any process opens a handle to lsass.exe (ProcDump, Mimikatz, etc.)
detect:
  event: SENSITIVE_PROCESS_ACCESS
  op: and
  rules:
    - op: is windows
    - op: ends with
      path: event/*/TARGET/FILE_PATH
      value: lsass.exe
      case sensitive: false
respond:
  - action: report
    name: LSASS Access - Possible Credential Dumping (T1003.001)
    metadata:
      tactic: Credential Access
      technique: T1003.001
      author: Lance Vidaure
